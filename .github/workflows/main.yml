name: Bing Rewards Daily
on:
  schedule:
    - cron: '0 12 * * *'   # runs daily at 12:00 PM UTC (5:30 PM IST)
  workflow_dispatch:      # allows you to run it manually for testing

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # Updated from v4 to v5
        uses: actions/checkout@v5

      - name: Set up Python
        # Updated from v5 to v6
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Binaries
        # Updated from v4 to v5
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss: Downloading Playwright browser..."
            playwright install chromium --with-deps
          else
            echo "Cache hit: Using existing Playwright browser..."
            playwright install-deps chromium
          fi

      - name: Run Scripts
        run: |
          python bing_search_24gv.py
          python bing_search_vizz.py
